name: CAD

on:
  push:
    paths: ["cad/**", ".github/workflows/cad.yml"]
  pull_request:
    paths: ["cad/**", ".github/workflows/cad.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cad/requirements.txt

      - name: Install pinned CAD toolchain
        run: pip install -r cad/requirements.txt

      - name: Build models, default slots + all haptic + all lite (fail on fit warnings)
        run: python cad/build.py --no-render --strict

      - name: Assembly checks (interference, screwdriver access, service, pinholes, key stack; knob slots in three configurations)
        run: python cad/assembly.py --check

      - name: Check committed outputs are up to date
        # STEP/DXF files embed timestamps, so compare the deterministic summary.
        run: |
          git diff --exit-code cad/out/summary.md || {
            echo "::error::cad/out/summary.md is stale. Run 'python cad/build.py' and commit cad/out/."
            exit 1
          }

  touch-band:
    # The touch band is an optional add-on, off by default (D24). Build and check it once,
    # default slots only, in parallel with the main job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cad/requirements.txt

      - name: Install pinned CAD toolchain
        run: pip install -r cad/requirements.txt

      - name: Assembly and fit checks with the touch band fitted (default slots)
        env:
          CLICKDECK_TOUCH_BAR: "1"
        run: python cad/assembly.py --check --default-only
